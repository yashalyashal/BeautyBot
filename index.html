<html lang="en">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; font-family: 'DM Sans', sans-serif; font-weight: 300; overflow-x: hidden; }

    body.theme-guest { background: #0d0a12; color: #f0eaf8; }
    body.theme-guest::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(120,60,200,0.13) 0%, transparent 55%), radial-gradient(ellipse at 80% 70%, rgba(60,100,200,0.09) 0%, transparent 55%);
    }

    body.theme-yuan { background: #00060f; color: #e0eeff; }
    body.theme-yuan::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(30,80,200,0.18) 0%, transparent 55%), radial-gradient(ellipse at 80% 80%, rgba(20,50,160,0.14) 0%, transparent 55%), radial-gradient(ellipse at 50% 50%, rgba(40,100,220,0.07) 0%, transparent 60%);
    }

    .petal { position: fixed; pointer-events: none; z-index: 0; animation: fall linear infinite; opacity: 0; }
    @keyframes fall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      5% { opacity: 0.5; } 95% { opacity: 0.2; }
      100% { transform: translateY(105vh) rotate(400deg); opacity: 0; }
    }

    #app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 5rem; display: block; }

    /* GUEST HEADER */
    .guest-header { text-align: center; margin-bottom: 3rem; }
    .guest-logo {
      font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 400;
      background: linear-gradient(135deg, #c9a8ff, #7eb8ff, #ffafd0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.3rem;
    }
    .guest-sub-author {
      font-size: 0.82rem;
      color: rgba(200,160,255,0.55);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .guest-tagline { font-size: 0.85rem; color: rgba(200,180,240,0.45); letter-spacing: 0.12em; text-transform: uppercase; }

    /* YUAN HEADER */
    .yuan-header { text-align: center; margin-bottom: 3rem; display: none; }

    .yuan-tagline { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem; color: rgba(140,180,255,0.5); }

    .field-label { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; }
    .theme-guest .field-label { color: rgba(200,180,240,0.45); }
    .theme-yuan .field-label { color: rgba(100,160,255,0.5); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; text-transform: none; letter-spacing: 0.06em; }

    textarea { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 300; padding: 1.2rem 1.4rem; resize: none; outline: none; line-height: 1.75; transition: border-color 0.3s; margin-bottom: 1.5rem; }
    .theme-guest textarea { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(200,160,255,0.18); color: #f0eaf8; border-radius: 18px; }
    .theme-guest textarea::placeholder { color: rgba(200,180,240,0.2); }
    .theme-guest textarea:focus { border-color: rgba(200,160,255,0.45); }
    .theme-yuan textarea { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(80,140,255,0.2); color: #e0eeff; border-radius: 18px; }
    .theme-yuan textarea::placeholder { color: rgba(100,160,255,0.25); }
    .theme-yuan textarea:focus { border-color: rgba(80,140,255,0.45); }

    .upload-zone { padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; margin-bottom: 1.5rem; }
    .theme-guest .upload-zone { border: 1.5px dashed rgba(200,160,255,0.22); background: rgba(255,255,255,0.02); border-radius: 20px; }
    .theme-guest .upload-zone:hover { border-color: rgba(200,160,255,0.5); background: rgba(150,80,255,0.05); }
    .theme-yuan .upload-zone { border: 1.5px dashed rgba(80,140,255,0.25); background: rgba(255,255,255,0.02); border-radius: 20px; }
    .theme-yuan .upload-zone:hover { border-color: rgba(80,140,255,0.55); background: rgba(30,80,220,0.05); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { width: 32px; height: 32px; margin: 0 auto 0.5rem; opacity: 0.35; }
    .upload-text { font-size: 0.82rem; line-height: 1.4; }
    .theme-guest .upload-text { color: rgba(200,180,240,0.45); }
    .theme-guest .upload-text strong { color: rgba(200,160,255,0.75); font-weight: 400; }
    .theme-yuan .upload-text { color: rgba(100,160,255,0.5); }
    .theme-yuan .upload-text strong { color: rgba(100,160,255,0.8); font-weight: 400; }

    .preview-container { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; display: none; }
    .preview-img { width: 70px; height: 70px; object-fit: cover; }

    .theme-yuan .preview-img { border: 0.5px solid rgba(80,140,255,0.25); border-radius: 12px; }
    .remove-img-btn { background: transparent; border: none; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
    .theme-guest .remove-img-btn { color: rgba(200,160,255,0.6); }
    .theme-yuan .remove-img-btn { color: rgba(100,160,255,0.6); }

    .conjure-btn { width: 100%; padding: 1rem; border: none; cursor: pointer; transition: all 0.3s; letter-spacing: 0.03em; }
    .theme-guest .conjure-btn { background: linear-gradient(135deg, #7b3fe4, #4a7de8); font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05rem; border-radius: 50px; color: white; }
    .theme-guest .conjure-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(120,60,220,0.35); }
    .theme-yuan .conjure-btn { background: linear-gradient(135deg, #1a4ac4, #426ee8); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; font-weight: 300; border-radius: 50px; color: white; }
    .theme-yuan .conjure-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(30,80,200,0.4); }
    .conjure-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .response-card { margin-top: 2rem; display: none; animation: fadeUp 0.6s ease; }
    .response-card.visible { display: block; }
    .response-inner { padding: 2.2rem 2rem 1.75rem; position: relative; }
    .theme-guest .response-inner { background: linear-gradient(145deg, rgba(100,50,200,0.1), rgba(50,80,200,0.07)); border: 0.5px solid rgba(200,160,255,0.18); border-radius: 22px; }
    .theme-yuan .response-inner { background: linear-gradient(145deg, rgba(20,50,180,0.1), rgba(30,80,220,0.07)); border: 0.5px solid rgba(80,140,255,0.2); border-radius: 22px; }
    .response-inner::before { content: '\201C'; position: absolute; top: 0.4rem; left: 1.25rem; font-family: 'Playfair Display', serif; font-size: 5rem; line-height: 1; pointer-events: none; }
    .theme-guest .response-inner::before { color: rgba(200,160,255,0.1); }
    .theme-yuan .response-inner::before { color: rgba(80,140,255,0.1); }
