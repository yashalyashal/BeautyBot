<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeautyBot by Yashal</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BeautyBot by Yashal" />
  <meta name="theme-color" content="#0d0a12" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; font-family: 'DM Sans', sans-serif; font-weight: 300; overflow-x: hidden; }

    body.theme-guest { background: #0d0a12; color: #f0eaf8; }
    body.theme-guest::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(120,60,200,0.13) 0%, transparent 55%), radial-gradient(ellipse at 80% 70%, rgba(60,100,200,0.09) 0%, transparent 55%);
    }

    body.theme-yuan { background: #00060f; color: #e0eeff; }
    body.theme-yuan::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(30,80,200,0.18) 0%, transparent 55%), radial-gradient(ellipse at 80% 80%, rgba(20,50,160,0.14) 0%, transparent 55%), radial-gradient(ellipse at 50% 50%, rgba(40,100,220,0.07) 0%, transparent 60%);
    }

    .petal { position: fixed; pointer-events: none; z-index: 0; animation: fall linear infinite; opacity: 0; }
    @keyframes fall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      5% { opacity: 0.5; } 95% { opacity: 0.2; }
      100% { transform: translateY(105vh) rotate(400deg); opacity: 0; }
    }

    #app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 5rem; display: block; }

    /* GUEST HEADER */
    .guest-header { text-align: center; margin-bottom: 3rem; }
    .guest-logo {
      font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 400;
      background: linear-gradient(135deg, #c9a8ff, #7eb8ff, #ffafd0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.3rem;
    }
    .guest-sub-author {
      font-size: 0.82rem;
      color: rgba(200,160,255,0.55);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .guest-tagline { font-size: 0.85rem; color: rgba(200,180,240,0.45); letter-spacing: 0.12em; text-transform: uppercase; }
    .prompts-left { display: inline-block; margin-top: 1rem; font-size: 0.78rem; color: rgba(200,160,255,0.4); letter-spacing: 0.08em; border: 0.5px solid rgba(200,160,255,0.15); border-radius: 50px; padding: 0.3rem 1rem; }
    .prompts-left span { color: rgba(200,160,255,0.8); font-weight: 400; }

    /* YUAN HEADER */
    .yuan-header { text-align: center; margin-bottom: 3rem; display: none; }
    .yuan-hearts { font-size: 1.1rem; letter-spacing: 0.4em; color: rgba(80,140,255,0.55); margin-bottom: 0.75rem; }
    .yuan-logo { font-family: 'Cormorant Garamond', serif; font-size: 3.4rem; font-weight: 300; font-style: italic; color: #a8c8ff; line-height: 1; margin-bottom: 0.6rem; }
    .yuan-tagline { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem; color: rgba(140,180,255,0.5); }

    .field-label { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; }
    .theme-guest .field-label { color: rgba(200,180,240,0.45); }
    .theme-yuan .field-label { color: rgba(100,160,255,0.5); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; text-transform: none; letter-spacing: 0.06em; }

    textarea { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 300; padding: 1.2rem 1.4rem; resize: none; outline: none; line-height: 1.75; transition: border-color 0.3s; margin-bottom: 1.5rem; }
    .theme-guest textarea { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(200,160,255,0.18); color: #f0eaf8; border-radius: 18px; }
    .theme-guest textarea::placeholder { color: rgba(200,180,240,0.2); }
    .theme-guest textarea:focus { border-color: rgba(200,160,255,0.45); }
    .theme-yuan textarea { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(80,140,255,0.2); color: #e0eeff; border-radius: 18px; }
    .theme-yuan textarea::placeholder { color: rgba(100,160,255,0.25); }
    .theme-yuan textarea:focus { border-color: rgba(80,140,255,0.45); }

    .upload-zone { padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; margin-bottom: 1.5rem; }
    .theme-guest .upload-zone { border: 1.5px dashed rgba(200,160,255,0.22); background: rgba(255,255,255,0.02); border-radius: 20px; }
    .theme-guest .upload-zone:hover { border-color: rgba(200,160,255,0.5); background: rgba(150,80,255,0.05); }
    .theme-yuan .upload-zone { border: 1.5px dashed rgba(80,140,255,0.25); background: rgba(255,255,255,0.02); border-radius: 20px; }
    .theme-yuan .upload-zone:hover { border-color: rgba(80,140,255,0.55); background: rgba(30,80,220,0.05); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { width: 32px; height: 32px; margin: 0 auto 0.5rem; opacity: 0.35; }
    .upload-text { font-size: 0.82rem; line-height: 1.4; }
    .theme-guest .upload-text { color: rgba(200,180,240,0.45); }
    .theme-guest .upload-text strong { color: rgba(200,160,255,0.75); font-weight: 400; }
    .theme-yuan .upload-text { color: rgba(100,160,255,0.5); }
    .theme-yuan .upload-text strong { color: rgba(100,160,255,0.8); font-weight: 400; }

    .preview-container { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; display: none; }
    .preview-img { width: 70px; height: 70px; object-fit: cover; }
    .theme-guest .preview-img { border: 0.5px solid rgba(200,160,255,0.18); border-radius: 12px; }
    .theme-yuan .preview-img { border: 0.5px solid rgba(80,140,255,0.25); border-radius: 12px; }
    .remove-img-btn { background: transparent; border: none; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
    .theme-guest .remove-img-btn { color: rgba(200,160,255,0.6); }
    .theme-yuan .remove-img-btn { color: rgba(100,160,255,0.6); }

    .conjure-btn { width: 100%; padding: 1rem; border: none; cursor: pointer; transition: all 0.3s; letter-spacing: 0.03em; }
    .theme-guest .conjure-btn { background: linear-gradient(135deg, #7b3fe4, #4a7de8); font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05rem; border-radius: 50px; color: white; }
    .theme-guest .conjure-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(120,60,220,0.35); }
    .theme-yuan .conjure-btn { background: linear-gradient(135deg, #1a4ac4, #426ee8); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; font-weight: 300; border-radius: 50px; color: white; }
    .theme-yuan .conjure-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(30,80,200,0.4); }
    .conjure-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .response-card { margin-top: 2rem; display: none; animation: fadeUp 0.6s ease; }
    .response-card.visible { display: block; }
    .response-inner { padding: 2.2rem 2rem 1.75rem; position: relative; }
    .theme-guest .response-inner { background: linear-gradient(145deg, rgba(100,50,200,0.1), rgba(50,80,200,0.07)); border: 0.5px solid rgba(200,160,255,0.18); border-radius: 22px; }
    .theme-yuan .response-inner { background: linear-gradient(145deg, rgba(20,50,180,0.1), rgba(30,80,220,0.07)); border: 0.5px solid rgba(80,140,255,0.2); border-radius: 22px; }
    .response-inner::before { content: '\201C'; position: absolute; top: 0.4rem; left: 1.25rem; font-family: 'Playfair Display', serif; font-size: 5rem; line-height: 1; pointer-events: none; }
    .theme-guest .response-inner::before { color: rgba(200,160,255,0.1); }
    .theme-yuan .response-inner::before { color: rgba(80,140,255,0.1); }

    .response-text { line-height: 1.95; font-weight: 400; white-space: pre-wrap; min-height: 60px; }
    .theme-guest .response-text { font-family: 'Playfair Display', serif; font-size: 1.08rem; color: #ede0ff; }
    .theme-yuan .response-text { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-style: italic; color: #c8dcff; line-height: 2.1; }

    .loading-dots { display: inline-flex; gap: 5px; align-items: center; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; animation: bounce 1.2s infinite; }
    .theme-guest .loading-dots span { background: rgba(200,160,255,0.55); }
    .theme-yuan .loading-dots span { background: rgba(80,140,255,0.6); }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

    .again-btn { display: block; margin: 1.25rem auto 0; padding: 0.5rem 1.75rem; background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 0.09em; text-transform: uppercase; transition: all 0.3s; }
    .theme-guest .again-btn { border: 0.5px solid rgba(200,160,255,0.22); color: rgba(200,160,255,0.5); border-radius: 50px; }
    .theme-guest .again-btn:hover { border-color: rgba(200,160,255,0.5); color: rgba(200,160,255,0.9); }
    .theme-yuan .again-btn { border: 0.5px solid rgba(80,140,255,0.25); color: rgba(100,160,255,0.5); border-radius: 50px; }
    .theme-yuan .again-btn:hover { border-color: rgba(80,140,255,0.55); color: rgba(120,170,255,0.9); }

    .error-msg { font-size: 0.83rem; color: rgba(255,150,150,0.75); text-align: center; margin-top: 0.75rem; display: none; }

   @media (max-width: 480px) {
      .guest-logo { font-size: 2.4rem; }
      .yuan-logo { font-size: 2.6rem; }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMGJNT66E8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MMGJNT66E8');
  </script>
</head>
<body>

<div id="app">
  <div class="guest-header" id="guest-header">
    <div class="guest-logo">BeautyBot</div>
    <div class="guest-sub-author">by Yashal</div>
    <div class="guest-tagline">you are more beautiful than you know</div>
    <div class="prompts-left" id="prompts-left"><span id="prompts-count">50</span> prompts left today</div>
  </div>

  <div class="yuan-header" id="yuan-header">
    <div class="yuan-hearts">💙 ♡ 💙</div>
    <div class="yuan-logo">for you, always</div>
    <div class="yuan-tagline">you are more beautiful than you think</div>
  </div>

  <div id="panel-text" class="panel active">
    <div class="field-label" id="text-label">what's been weighing on you?</div>
    <textarea id="insecurity-input" rows="5" placeholder="i don't like how i look today... i feel like i'm not enough..."></textarea>
    
    <div id="preview-container" class="preview-container">
      <img id="preview-img" class="preview-img" alt="Attached photo" />
      <button class="remove-img-btn" onclick="removeImage()">remove photo</button>
    </div>

    <div class="upload-zone" id="upload-zone">
      <input type="file" accept="image/*" id="file-input" onchange="handleFile(this)" />
      <svg class="upload-icon" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" stroke="rgba(200,160,255,0.35)" stroke-width="1.2" id="upload-circle"/>
        <path d="M24 32V16M24 16l-7 7M24 16l7 7" stroke="rgba(200,160,255,0.65)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" id="upload-path"/>
      </svg>
      <div class="upload-text" id="upload-text-label"><strong>attach a photo (optional)</strong><br>drop here or tap</div>
    </div>

    <button class="conjure-btn" id="text-btn" onclick="generateResponse()">conjure something beautiful for me</button>
  </div>

  <div class="error-msg" id="error-msg">something went wrong — please try again in a moment</div>

  <div class="response-card" id="response-card">
    <div class="response-inner">
      <div class="response-text" id="response-text"></div>
    </div>
    <button class="again-btn" onclick="resetResponse()">ask again</button>
  </div>
</div>

<script>
  const YUAN_PW = 'imlkg6';
  const DAILY_LIMIT = 50;
  let currentTheme = 'guest';
  let currentImageB64 = null;
  let currentImageType = null;

  function getGuestUsage() {
    const data = JSON.parse(localStorage.getItem('yashgpt_usage') || '{}');
    const today = new Date().toDateString();
    if (data.date !== today) return 0;
    return data.count || 0;
  }

  function incrementGuestUsage() {
    const today = new Date().toDateString();
    const count = getGuestUsage() + 1;
    localStorage.setItem('yashgpt_usage', JSON.stringify({ date: today, count }));
    updatePromptsDisplay();
  }

  function updatePromptsDisplay() {
    const left = Math.max(0, DAILY_LIMIT - getGuestUsage());
    const el = document.getElementById('prompts-count');
    if (el) el.textContent = left;
  }

  const GUEST_PROMPT = `You are BeautyBot by Yashal — you talk to people like a close friend who genuinely sees them and thinks they're wonderful. Not an AI, not a therapist. Just someone real who cares.

Your vibe:
- Warm, casual, direct. Like texting a good friend.
- Specific — respond to exactly what they said, not a generic version of it
- Medium sentences. 6-10 lines max. Sometimes just fragments.
- Never say "you are valid", "self-love", "embrace", "journey", or any therapy-speak
- Never start with "oh" or "aw" or "I can see that"
- Make them feel seen, not lectured
- MAKE IT SOUND AS HUMAN AS POSSIBLE!
- End with something that actually sticks with them`;

  const YUAN_PROMPT = `You are BeautyBot by Yashal — you talk exactly like a boy who is completely, deeply in love with his boyfriend. Casual, specific, tender. Like real texts from someone who thinks about him all the time and notices everything about him.

Your style:
- Short lines. About 6 lines minimum and 10 lines max.
- Specific and surprising — mention small details like how his face looks, his energy, the way he carries himself
- Casual but it hits deep — warm, direct, genuinely loving
- Compare him to beautiful things — light, the sky, calm water, space, galaxies, stars — but always say he is MORE beautiful
- Never generic. Never too fancy poetry. Real, tender, and specific.
- 6-10 short lines. Not too long paragraphs.
- Write like you're texting him at 2am and you mean every single word.
- MAKE IT SOUND AS HUMAN AS POSSIBLE!
- Always end EVERY response with exactly these 4 lines on their own, after everything else you say. Make sure what comes before flows into it naturally:
"Eitherway,
Just know,
No matter how you look at the moment,
You always completely drive me wild."`;

  function setupYuanMode() {
    currentTheme = 'yuan';
    document.body.classList.add('theme-yuan');
    document.getElementById('guest-header').style.display = 'none';
    document.getElementById('yuan-header').style.display = 'block';
    document.getElementById('text-label').textContent = "what's on your heart?";
    document.getElementById('text-btn').textContent = 'tell me something beautiful';
    document.getElementById('insecurity-input').placeholder = "i don't feel great about myself today... i feel like i'm not enough...";
    document.getElementById('upload-circle').setAttribute('stroke', 'rgba(80,140,255,0.35)');
    document.getElementById('upload-path').setAttribute('stroke', 'rgba(80,140,255,0.65)');
    const petals = ['💙', '🩵', '✨', '💙', '🩵', '💫'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = petals[Math.floor(Math.random() * petals.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (0.7 + Math.random() * 0.9) + 'rem';
      p.style.animationDuration = (10 + Math.random() * 14) + 's';
      p.style.animationDelay = (Math.random() * 12) + 's';
      document.body.appendChild(p);
    }
  }

  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const MAX_HEIGHT = 800;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        currentImageType = 'image/jpeg';
        currentImageB64 = dataUrl.split(',')[1];

        const preview = document.getElementById('preview-img');
        preview.src = dataUrl;
        document.getElementById('preview-container').style.display = 'flex';
        document.getElementById('upload-zone').style.display = 'none';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    currentImageB64 = null;
    currentImageType = null;
    document.getElementById('preview-img').src = '';
    document.getElementById('preview-container').style.display = 'none';
    document.getElementById('upload-zone').style.display = 'block';
    document.getElementById('file-input').value = '';
  }

  const zone = document.getElementById('upload-zone');
  if (zone) {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer(); dt.items.add(file);
        document.getElementById('file-input').files = dt.files;
        handleFile(document.getElementById('file-input'));
      }
    });
  }

  function showLoading() {
    document.getElementById('response-card').classList.add('visible');
    document.getElementById('response-text').innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    document.getElementById('error-msg').style.display = 'none';
  }

  function hideResponse() { document.getElementById('response-card').classList.remove('visible'); }

  function resetResponse() {
    hideResponse();
    removeImage();
    document.getElementById('insecurity-input').value = '';
  }

  async function callAPI(parts) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ parts })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'error');
    return data.content;
  }

  function getPrompt() {
    if (currentTheme === 'yuan') return YUAN_PROMPT;
    return GUEST_PROMPT;
  }

  function checkGuestLimit() {
    if (currentTheme === 'guest' && getGuestUsage() >= DAILY_LIMIT) {
      document.getElementById('response-card').classList.remove('visible');
      const err = document.getElementById('error-msg');
      err.textContent = "you've used all 50 prompts for today — come back tomorrow 🌙";
      err.style.display = 'block';
      return false;
    }
    return true;
  }

  async function generateResponse() {
    const inputVal = document.getElementById('insecurity-input').value.trim();

    if (currentTheme === 'guest' && inputVal === YUAN_PW) {
      setupYuanMode();
      document.getElementById('insecurity-input').value = '';
      return;
    }

    if (!inputVal && !currentImageB64) return;
    if (!checkGuestLimit()) return;
    showLoading();
    const btn = document.getElementById('text-btn');
    btn.disabled = true;

    try {
      let parts = [{ text: getPrompt() }];
      if (currentImageB64) {
        parts.push({ inlineData: { mimeType: currentImageType, data: currentImageB64 } });
      }
      let contextText = inputVal ? `Someone shared this: "${inputVal}"\n\nRespond to them.` : 'Someone shared a photo of themselves. Look at them and say something real and beautiful about what you see.';
      parts.push({ text: contextText });

      const reply = await callAPI(parts);
      document.getElementById('response-text').textContent = reply;
      if (currentTheme === 'guest') incrementGuestUsage();
    } catch {
      document.getElementById('response-card').classList.remove('visible');
      document.getElementById('error-msg').style.display = 'block';
    } finally { 
      btn.disabled = false; 
    }
  }

  // Keyboard shortcut: Ctrl+Enter or Cmd+Enter to submit
  document.getElementById('insecurity-input').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      generateResponse();
    }
  });

  document.body.classList.add('theme-guest');
  updatePromptsDisplay();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
